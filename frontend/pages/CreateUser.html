<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<link rel="stylesheet" href="../index.css"  />
<script src="../script/CreateUser.js" defer></script>
</head>
<body>
    <!--Navbar-->
    <header class="navbar">
        <figure class="logo">CRUD-APP</figure>

            <nav class="navlinks">
                    <a href="../index.html">Home</a>
                    <a href="./CreateUser.html">Create User</a>
                    <a href="./AllUsers.html">All Users</a>
                </nav>
    </header>
    <!--MAIN SECTION-->
    <main class="main-container">
        <h1> Create User</h1>
        <form id="register-form" class="form">
            <label for="fullname">Fullname</label>
            <input type="text" name="fullname" id="fullname" placeholder="Enter your fullname"/>
            <br />
            <label for="email">Email</label>
            <input 
            type="email" 
            name="email"
             id="email"
              placeholder="Enter your email"
             required
        />
            <br />
            <label for="Password">Password</label>
            <input
            type="password"
             name="password"
              id="password"
               placeholder="Enter your password"
               minlength="8"
                required
       />
            <br />
            <button> Create </button>
        </form>
        </main>
</body>
</html>
